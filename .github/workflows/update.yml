name: Update WEO data

on:
  schedule:
    - cron: '0 6 20 4 *'   # ~2 weeks after the April WEO release
    - cron: '0 6 20 10 *'  # ~2 weeks after the October WEO release
  workflow_dispatch:         # allow manual trigger at any time

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/process.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update WEO data [$(date +%Y-%m)]"
          git push
